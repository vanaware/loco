name: Release and Deploy

on:
  push:
    tags:
      - 'v*' # Dispara apenas para tags iniciando com 'v' (ex: v0.2, v1.0.0)

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.set_tag.outputs.VERSION_TAG }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set Tag Output
        id: set_tag
        run: echo "VERSION_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Run Tests
        run: deno task tests

      # No build, as variaveis opcionais podem ficar vazias, o Deno lida bem com isso
      - name: Run Build Script
        env:
          SERVER_PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
          SERVER_PUBLIC_KEY: ${{ secrets.SERVER_PUBLIC_KEY }}
          PORT: ${{ secrets.PORT }}
          PROXY_PATH: ${{ secrets.PROXY_PATH }}
        run: deno task build

      - name: Zip Release Files
        run: zip -r build.zip build/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: |
            build.zip
            wrangler.toml
          if-no-files-found: error
          retention-days: 1

  create-release:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build.zip
          name: Release ${{ needs.test-and-build.outputs.version }}
          tag_name: ${{ needs.test-and-build.outputs.version }}

  deploy-pages:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Unzip Build
        run: unzip build.zip

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Unzip Build
        run: unzip build.zip

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # 🔥 Variáveis opcionais são tratadas como VARS (texto plano). 
          # Se vazias, a Cloudflare ignora ou define como vazio sem quebrar o runner.
          vars: |
            SERVER_PUBLIC_KEY
            SERVER_PRIVATE_KEY
            PROXY_PATH
        env:
          SERVER_PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
          SERVER_PUBLIC_KEY: ${{ secrets.SERVER_PUBLIC_KEY }}
          PROXY_PATH: ${{ secrets.PROXY_PATH }}