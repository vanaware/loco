<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proto Template</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root {
        --md-sys-color-primary: #006c4f;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-surface: #f5f5f5;
        --md-sys-color-on-surface: #1a1a1a;
        --bg: #f5f5f5;
        --fg: #1a1a1a;
        --accent: #006c4f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      #app { padding: 1rem; max-width: 640px; margin: 0 auto; }
      .title { font-size: 2rem; margin-bottom: 0.25rem; }
      .subtitle { color: #666; margin-bottom: 1.5rem; }
      .card {
        background: white;
        border-radius: 0.75rem;
        padding: 1rem;
        margin-top: 1rem;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }
      .card-title { font-size: 1.25rem; margin-top: 0; }
      .greeting { margin: 1rem 0; font-weight: 500; }
      .count { font-size: 1.125rem; margin: 1rem 0; }
      .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
      .loading { color: #666; font-style: italic; }
      md-outlined-text-field { width: 100%; }
    </style>
  </head>
  <body>
    <div id="app">Carregando...</div>
    <script type="module" src="/app.tsx"></script>
  </body>
</html>
