<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proto 01 — PWA Push</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
      /* Overlay de erro visível para debug em dispositivos móveis */
      #error-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255,0,0,0.9);
        color: white;
        padding: 1rem;
        font-family: monospace;
        font-size: 0.875rem;
        overflow-y: auto;
        z-index: 9999;
        word-break: break-word;
      }
      #error-overlay.visible { display: block; }
      #error-overlay h3 { margin: 0 0 0.5rem; }
      #error-overlay pre { margin: 0.5rem 0; white-space: pre-wrap; }
      #error-overlay button {
        background: white;
        color: red;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: bold;
      }
      :root {
        --md-sys-color-primary: #006c4f;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-surface: #f5f5f5;
        --md-sys-color-on-surface: #1a1a1a;
        --bg: #f5f5f5;
        --fg: #1a1a1a;
        --accent: #006c4f;
        --surface: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      #app { padding: 1rem; max-width: 640px; margin: 0 auto; }
      h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
      .status {
        font-size: 0.875rem;
        color: #555;
        margin-bottom: 1rem;
      }
      .card {
        background: var(--surface);
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1rem;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }
      .app { display: flex; height: 100dvh; overflow: hidden; }
      .sidebar { width: 320px; border-right: 1px solid #ddd; display: flex; flex-direction: column; background: #f8f9fa; height: 100dvh; }
      .sidebar-header { padding: 1rem; border-bottom: 1px solid #ddd; flex-shrink: 0; }
      .app-title { font-size: 1.25rem; margin: 0 0 0.5rem; }
      .my-identity { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
      .identity-details { background: #fff; border: 1px solid #ddd; border-radius: 0.5rem; padding: 0.5rem; margin-bottom: 0.5rem; font-size: 0.75rem; }
      .detail-row { display: flex; gap: 0.5rem; }
      .detail-label { color: #666; }
      .detail-value { font-family: monospace; word-break: break-all; }
      .status { font-size: 0.75rem; color: #666; margin: 0.5rem 0 0; }
      .add-contact { padding: 0.75rem 1rem; display: flex; gap: 0.5rem; border-bottom: 1px solid #ddd; flex-shrink: 0; align-items: flex-end; }
      .add-contact-fields { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
      .contact-list { flex: 1; overflow-y: auto; min-height: 0; }
      .contact { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; cursor: pointer; border-bottom: 1px solid #eee; }
      .contact:hover { background: #e9ecef; }
      .contact.active { background: #d1e7dd; }
      .contact-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: white; display: grid; place-items: center; font-weight: 600; flex-shrink: 0; }
      .contact-info { min-width: 0; }
      .contact-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .contact-id { font-size: 0.7rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .contact-preview { font-size: 0.8rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .empty { padding: 1rem; text-align: center; color: #888; }
      .chat { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
      .chat-placeholder { flex: 1; display: grid; place-items: center; color: #666; }
      .chat-header { padding: 0.75rem 1rem; background: #f0f0f0; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 0.75rem; }
      .back-button { display: none; margin-right: 0.25rem; --md-icon-button-icon-size: 24px; }
      .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
      .message-bubble { max-width: 70%; padding: 0.5rem 0.75rem; border-radius: 0.75rem; position: relative; word-break: break-word; }
      .message-bubble.me { align-self: flex-end; background: #d1e7dd; border-bottom-right-radius: 0.25rem; }
      .message-bubble.other { align-self: flex-start; background: white; border-bottom-left-radius: 0.25rem; }
      .message-text { display: block; }
      .message-time { display: block; font-size: 0.7rem; color: #666; text-align: right; margin-top: 0.25rem; }
      .chat-input { padding: 0.75rem 1rem; background: #f0f0f0; border-top: 1px solid #ddd; display: flex; gap: 0.5rem; align-items: center; }

      /* Workaround: desabilitar animação do label no md-outlined-text-field para evitar erro NaN */
      md-outlined-text-field .label {
        transition: none !important;
        animation: none !important;
      }
      md-outlined-text-field::part(label) {
        transition: none !important;
        animation: none !important;
      }

      /* Painel de logs visível */
      .debug-panel {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: #1a1a2e;
        color: #0f0;
        font-family: monospace;
        font-size: 0.75rem;
        max-height: 40vh;
        display: flex;
        flex-direction: column;
        z-index: 9998;
        border-top: 2px solid #0f0;
      }
      .debug-panel-header {
        display: flex;
        align-items: center;
        padding: 6px 12px;
        background: #16213e;
        cursor: pointer;
        user-select: none;
      }
      .debug-logs {
        overflow-y: auto;
        padding: 8px 12px;
        flex: 1;
        min-height: 0;
        max-height: calc(40vh - 32px);
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .debug-line { margin: 0; padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
      .debug-line.error { color: #ff4444; font-weight: bold; }
      .debug-line.warn { color: #ffaa00; }
      .debug-line.LOG { color: #0f0; }
      .debug-line.WARN { color: #ffaa00; }
      .debug-line.ERROR { color: #ff4444; }
      .debug-line.INIT { color: #aaaaff; }

      @media (max-width: 768px) {
        .app { position: relative; height: 100dvh; }
        .sidebar { width: 100%; position: absolute; top: 0; left: 0; height: 100dvh; z-index: 5; }
        .app.mobile-chat .sidebar { display: none; }
        .chat { width: 100%; position: absolute; top: 0; left: 0; height: 100dvh; z-index: 10; display: none; }
        .app.mobile-chat .chat { display: flex; }
        .app.mobile-contacts .chat { display: none; }
        .chat-header { min-height: 56px; flex-shrink: 0; }
        .chat-input { flex-shrink: 0; }
        .chat-messages { flex: 1; min-height: 0; }
        .back-button { display: inline-flex; }
      }
    </style>
  </head>
  <body>
    <div id="error-overlay">
      <h3>❌ ERRO DO APP</h3>
      <pre id="error-content"></pre>
      <button onclick="this.parentElement.classList.remove('visible')">Fechar</button>
    </div>
    <div id="app">Carregando...</div>
    <script type="module" src="/app.js"></script>
    <script>
      // Captura erros não tratados e mostra no overlay (para debug em mobile)
      window.addEventListener("error", function(e) {
        var el = document.getElementById("error-overlay");
        if (el) {
          var content = document.getElementById("error-content");
          if (content) {
            content.textContent = "GLOBAL ERROR:\n" + (e.error?.stack || e.message || JSON.stringify(e.error));
          }
          el.classList.add("visible");
        }
      });
      window.addEventListener("unhandledrejection", function(e) {
        var el = document.getElementById("error-overlay");
        if (el) {
          var content = document.getElementById("error-content");
          if (content) {
            content.textContent = "UNHANDLED REJECTION:\n" + (e.reason?.stack || e.reason?.message || JSON.stringify(e.reason));
          }
          el.classList.add("visible");
        }
      });
    </script>
  </body>
</html>
