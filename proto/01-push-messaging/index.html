<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proto 01 — PWA Push</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root {
        --bg: #f5f5f5;
        --fg: #1a1a1a;
        --accent: #006c4f;
        --surface: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      #app { padding: 1rem; max-width: 640px; margin: 0 auto; }
      h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
      .status {
        font-size: 0.875rem;
        color: #555;
        margin-bottom: 1rem;
      }
      .card {
        background: var(--surface);
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1rem;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }
      label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; color: #444; }
      input, textarea {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
        font-size: 1rem;
      }
      textarea { resize: none; min-height: 4rem; }
      button {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 0.5rem;
        padding: 0.6rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .row { display: flex; gap: 0.5rem; align-items: center; }
      .message { padding: 0.5rem; border-radius: 0.5rem; margin-bottom: 0.5rem; }
      .message.me { background: #e0f2eb; margin-left: 2rem; }
      .message.other { background: #f0f0f0; margin-right: 2rem; }
      .mono { font-family: monospace; font-size: 0.85rem; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="app">Carregando...</div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
